[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quic-lab"
version = "0.1.0"
description = "A minimal QUIC echo lab: server, client, metrics — Python + aioquic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aioquic>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
quic-lab = "quic_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
